*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#060606;
  font-family:"Space Grotesk",sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:36px 24px 60px;gap:18px;
  -webkit-font-smoothing:antialiased;
}
.ui-label{color:#444;font-size:12px;letter-spacing:.5px;text-transform:uppercase;font-family:"Space Grotesk",sans-serif}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{
  padding:9px 22px;border-radius:8px;border:none;
  font-size:13px;font-weight:600;font-family:"Space Grotesk",sans-serif;
  cursor:pointer;transition:opacity .15s,transform .1s;
}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn-export{
  background:linear-gradient(135deg,#6c3ce0,#a78bfa);
  color:#fff;box-shadow:0 4px 20px rgba(124,91,245,.35);
}
.btn-copy{background:#141414;color:#f5f2eb;border:1px solid rgba(255,255,255,.08)}
.btn-v{
  background:transparent;color:#555;
  border:1px solid rgba(255,255,255,.1);
  font-size:12px;padding:7px 16px;
}
.btn-v.on{border-color:#7c5bf5;color:#a78bfa;background:rgba(124,91,245,.09)}
.note{color:#333;font-size:11px;font-family:"Space Grotesk",sans-serif}
.wrap{
  transform-origin:top center;
  transform:scale(.58);
  margin-bottom:-266px;
  border-radius:4px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 32px 80px rgba(0,0,0,.8);
}
canvas{display:block}

const VARIANTS = {
  default:  { bg: '#0a0a0a',  glowA: .20 },
  gradient: { bg: ['#0a0a0a','#0e0720','#130a2e','#0a0a0a'], glowA: .26 },

};

// ── helpers ────────────────────────────────────────────────────────────
function loadImg(src) {
  return new Promise(res => { const i=new Image(); i.onload=()=>res(i); i.src=src; });
}

function wrapText(ctx, text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line+' '+w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line=w; }
    else line=t;
  }
  if (line) lines.push(line);
  return lines;
}

// ── main draw ──────────────────────────────────────────────────────────
async function draw(vname) {
  await document.fonts.ready;
  const v   = VARIANTS[vname];
  const cv  = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W=1200, H=630, PX=72, PY=52;

  // 1. background
  if (Array.isArray(v.bg)) {
    const g = ctx.createLinearGradient(0,0,W,H);
    const stops = v.bg;
    stops.forEach((c,i) => g.addColorStop(i/(stops.length-1), c));
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = v.bg;
  }
  ctx.fillRect(0,0,W,H);

  // 2. purple radial glow
  const gr = ctx.createRadialGradient(560,240,0, 560,240,520);
  gr.addColorStop(0,   `rgba(124,91,245,${v.glowA})`);
  gr.addColorStop(.30, `rgba(167,139,250,${(v.glowA*.45).toFixed(3)})`);
  gr.addColorStop(.55, `rgba(59,130,246,.03)`);
  gr.addColorStop(.75, 'rgba(0,0,0,0)');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);

  // 3. dot grid (fades left→right)
  for (let gx=40; gx<W; gx+=40) {
    for (let gy=20; gy<H; gy+=40) {
      const a = Math.min(.07, (gx/W)*.14);
      ctx.fillStyle=`rgba(255,255,255,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(gx,gy,1,0,Math.PI*2); ctx.fill();
    }
  }

  // 4. top accent line
  const al=ctx.createLinearGradient(0,0,W,0);
  al.addColorStop(0,'rgba(0,0,0,0)');
  al.addColorStop(.25,'#7c5bf5');
  al.addColorStop(.6,'#a78bfa');
  al.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=al; ctx.fillRect(0,0,W,2);

  // 5. logo
  const logo = await loadImg(LOGO_URI);
  const lH=52, lW=logo.width/logo.height*lH;
  ctx.drawImage(logo, PX, PY, lW, lH);

  // 6. headline
  ctx.textBaseline='alphabetic';
  const FS=52, LH=62, HX=PX, HY1=202;

  // line 1: "Custom CRM, " [Syne 800] + "SaaS" [Playfair italic] + " &" [Syne 800]
  ctx.fillStyle='#f5f2eb';
  ctx.font=`800 ${FS}px "Syne"`;
  const p1='Custom CRM, ';
  const p1w=ctx.measureText(p1).width;
  ctx.fillText(p1, HX, HY1);

  ctx.fillStyle='#a78bfa';
  ctx.font=`italic 400 ${FS}px "Playfair Display"`;
  const p2='SaaS';
  const p2w=ctx.measureText(p2).width;
  ctx.fillText(p2, HX+p1w, HY1);

  ctx.fillStyle='#f5f2eb';
  ctx.font=`800 ${FS}px "Syne"`;
  ctx.fillText(' &', HX+p1w+p2w, HY1);

  // line 2
  ctx.fillStyle='#f5f2eb';
  ctx.font=`800 ${FS}px "Syne"`;
  ctx.fillText('Operations Software.', HX, HY1+LH);

  // line 3 — purple
  ctx.fillStyle='#a78bfa';
  ctx.font=`800 ${FS}px "Syne"`;
  ctx.fillText('AI‑Powered.', HX, HY1+LH*2);

  // 7. subtitle
  ctx.fillStyle='#8a8680';
  ctx.font='400 18px "Space Grotesk"';
  const subTxt='We build custom CRMs, business software, operations tools, SaaS products, and AI automations — tailored to how your business actually runs.';
  const subLines = wrapText(ctx, subTxt, 740);
  const subY0 = HY1+LH*2+36;
  subLines.forEach((ln,i) => ctx.fillText(ln, HX, subY0+i*29));

  // 8. stats
  const stats=[
    {num:'100%',  lbl:'On-time Delivery'},
    {num:'4.9 ★', lbl:'Client Rating'},
    {num:'3+ yrs',lbl:'Building'},
  ];
  const numY=550, lblY=573;
  let sx=PX;
  stats.forEach((s,i) => {
    // measure widths
    ctx.font='800 26px "Syne"';
    const nw=ctx.measureText(s.num).width;
    ctx.font='400 13px "Space Grotesk"';
    const lw=ctx.measureText(s.lbl).width;
    const bw=Math.max(nw,lw);

    // separator (before item 1+)
    if (i>0) {
      ctx.strokeStyle='rgba(255,255,255,.12)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(sx-22,537); ctx.lineTo(sx-22,578); ctx.stroke();
    }

    // number
    ctx.fillStyle='#f5f2eb';
    ctx.font='800 26px "Syne"';
    ctx.fillText(s.num, sx, numY);

    // label
    ctx.fillStyle='#8a8680';
    ctx.font='400 13px "Space Grotesk"';
    ctx.fillText(s.lbl, sx, lblY);

    sx += bw+44;
  });
}

// ── variant switching ──
function setV(name) {
  currentV=name;
  document.querySelectorAll('.btn-v').forEach(b=>b.classList.remove('on'));
  document.getElementById('v-'+name).classList.add('on');
  draw(name);
}

// ── export ──
function doExport() {
  const cv=document.getElementById('c');
  const a=document.createElement('a');
  a.download='orchix-og-image.png';
  a.href=cv.toDataURL('image/png',1.0);
  a.click();
}

function doCopy() {
  const cv=document.getElementById('c');
  cv.toBlob(async blob=>{
    try {
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      alert('Copied ✓');
    } catch(e) { alert('Clipboard blocked — use Export instead.'); }
  },'image/png');
}

// ── init ──
draw('default');
</script>
